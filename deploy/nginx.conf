server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne jamais servir les sources de build ni les notes internes
    location ~ ^/(_build|_source)/ { return 404; }

    # Compression
    gzip on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Cache : assets longs, HTML court (site statique mis à jour à la main)
    # Pas d add_header ici : un add_header dans un location annule TOUS ceux
    # du bloc server (securite, X-Robots-Tag). expires suffit a poser Cache-Control.
    location ~* \.(css|js)$ { expires 7d; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ { expires 30d; }
    location / {
        expires 1h;
        try_files $uri $uri/ =404;
    }

    # Version anglaise : meme regles, mais sa propre page 404.
    # Pas d add_header ici non plus (voir la remarque ci-dessus).
    location /en/ {
        expires 1h;
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # PREVIEW oneiro.arinaudo.fr : empeche l indexation Google du sous-domaine de test.
    # A SUPPRIMER le jour de la bascule sur le domaine public.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Vraie page 404 (renvoyer l accueil brouillait le signal pour Google)
    error_page 404 /404.html;
}
